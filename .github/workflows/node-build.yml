name: Node.js CI Build

# Define os eventos que disparam o workflow
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    # Executa o build em um ambiente Linux limpo
    runs-on: ubuntu-latest

    strategy:
      # Testa o código em diferentes versões do Node.js
      matrix:
        node-version: [20.x, 22.x]

    steps:
      # 1. Faz o checkout do código do repositório
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configura o ambiente com a versão do Node.js correspondente
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm' # Ativa o cache automático para acelerar os próximos builds

      # 3. Instala as dependências de forma limpa e segura
      - name: Install dependencies
        run: npm ci

      # 4. Executa o build do projeto (remova ou comente se não houver etapa de build)
      - name: Build project
        run: npm run build --if-present

      # 5. Executa os testes automatizados
      - name: Run tests
        run: npm test --if-present
